<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas | AIREC Grupo Médico</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/estadisticas.css">
</head>
<body>
<header>
  <div class="encabezado-estadisticas">
    <a href="dashboard.html" class="logo-dashboard" title="Volver al panel de PQRS" aria-label="Volver al panel de PQRS">
      <img src="img/logo-airec.png" alt="AIREC Grupo Médico">
    </a>
    <h1>Estadísticas · AIREC</h1>
  </div>
  <div class="nav">
    <a class="enlace-nav" href="dashboard.html">← Volver al panel</a>
    <button type="button" id="salir">Cerrar sesión</button>
  </div>
</header>
<main>
  <div id="msg" class="msg oculto"></div>

  <div class="cards">
    <div class="card"><b id="eTotal">0</b><span>Total de PQRS</span></div>
    <div class="card rosa"><b id="eSin">0</b><span>Sin asignar</span></div>
    <div class="card verde"><b id="eVencidos">0</b><span>Vencidos</span></div>
    <div class="card gris"><b id="eCerrados">0</b><span>Cerrados</span></div>
  </div>

  <div class="graficas">
    <section class="grafica">
      <h2>Por tipo de solicitud</h2>
      <div class="lienzo"><canvas id="gTipo"></canvas></div>
    </section>
    <section class="grafica">
      <h2>Por estado</h2>
      <div class="lienzo"><canvas id="gEstado"></canvas></div>
    </section>
    <section class="grafica">
      <h2>Por categoría</h2>
      <div class="lienzo"><canvas id="gCategoria"></canvas></div>
    </section>
    <section class="grafica">
      <h2>Por sede</h2>
      <div class="lienzo"><canvas id="gSede"></canvas></div>
    </section>
    <section class="grafica ancha">
      <h2>PQRS radicados por mes</h2>
      <div class="lienzo"><canvas id="gMes"></canvas></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/estadisticas.js"></script>
</body>
</html>
